      <stop stop-color="#09131f"/>
      <stop offset=".6" stop-color="#142b36"/>
      <stop offset="1" stop-color="#0a1621"/>
    </linearGradient>
    <linearGradient id="gold">
      <stop stop-color="#f4d7a0"/>
      <stop offset="1" stop-color="#a88a54"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
