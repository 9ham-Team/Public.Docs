<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">9ham-Team — A signal beyond the storm</title>
  <desc id="desc">深蓝色的电台档案横幅，金色频谱、同心无线电波纹与复古仪表装饰，呈现重返未来：1999玩家和业余无线电爱好者的交汇。</desc>
  <defs>
